services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/logs:/app/backend/logs
    ports:
      - "8501:8000"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_HOST: backend
    ports:
      - "8500:80"
    depends_on:
      - backend
